<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jóga Órarend</title>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <link rel="stylesheet" href="style.css?v=20260901-2">
</head>
<body>
    <div class="container">
        <h1>Jóga Órarend és Foglalás</h1>
        <div id="calendar"></div>
    </div>

    <div id="booking-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">Jelentkezés</h2>

            <div id="class-info" class="class-info">
                <div id="modal-time"></div>
                <div id="modal-free-spots"></div>
                <div id="modal-instructor" class="class-instructor"></div>
                <div id="modal-note" class="class-note"></div>
                <div id="modal-zoom" class="class-zoom"></div>
            </div>

            <div class="form-group">
                <label for="user-name">Teljes név</label>
                <input type="text" id="user-name" required>
            </div>

            <div class="form-group">
                <label for="user-email">E-mail cím</label>
                <input type="email" id="user-email" required>
            </div>

            <div class="modal-actions">
                <button id="cancel-btn" class="btn-secondary">Mégsem</button>
                <button id="submit-btn" class="btn-primary">Jelentkezem</button>
            </div>
        </div>
    </div>

    <script src="app.js?v=20260901-2"></script>
</body>
</html>
